<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>页边 · 宣传头图</title>
    <style>
      @font-face {
        font-family: 'YebianHand';
        src: url('public/fonts/zcool-qingke-huangyou-subset.woff2') format('woff2');
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #12100c; }
      .promo {
        position: relative;
        width: 1600px;
        height: 900px;
        margin: 0 auto;
        overflow: hidden;
        background: url('public/paper-bg.jpg') center / cover no-repeat;
        color: #12100c;
      }
      .promo::after {
        /* 四周轻微的纸色压暗，让主体浮出来 */
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 30% 20%, rgba(243, 236, 221, 0) 40%, rgba(74, 66, 52, 0.18) 100%);
        pointer-events: none;
      }
      .frame { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
      .brand { display: inline-block; width: max-content; }
      .brand img { display: block; }
      .brand-logo { height: 96px; width: auto; }
      .brand-sub { height: 30px; width: auto; margin-top: 16px; }
      .hero { margin-top: 120px; }
      .hero img { display: block; height: 88px; width: auto; filter: url(#roughen); }
      .hero img + img { margin-top: 26px; }
      .tagline {
        margin-top: 46px;
        font-family: 'YebianHand', 'PingFang SC', sans-serif;
        font-size: 38px;
        letter-spacing: 0.08em;
        color: #4b4b4b;
      }
      .tagline .dot { color: #4a6b9a; }
      .url-line {
        margin-top: auto;
        font-family: 'YebianHand', 'PingFang SC', sans-serif;
        font-size: 22px;
        letter-spacing: 0.05em;
        color: #6a6559;
        padding-bottom: 6px;
      }
      .sticker {
        position: absolute;
        right: 110px;
        bottom: 96px;
        width: 190px;
        height: auto;
        transform: rotate(8deg);
        filter: drop-shadow(0 10px 14px rgba(43, 38, 28, 0.28));
      }
      svg.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div class="promo">
      <svg class="defs" aria-hidden="true" focusable="false">
        <filter id="roughen" x="-30%" y="-30%" width="160%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise"></feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
      </svg>
      <div class="frame">
        <a class="brand" aria-label="页边 THE MARGIN">
          <img class="brand-logo" src="public/logo-yebian.png" alt="页边" />
          <img class="brand-sub" src="public/logo-margin.png" alt="THE MARGIN" />
        </a>
        <div class="hero">
          <img src="public/heading-line1.png" alt="生活很厚" />
          <img src="public/heading-line2.png" alt="页边，留一点空白" />
        </div>
        <p class="tagline">正文归知乎，页边归每一个人<span class="dot">。</span></p>
        <p class="url-line">noenmusic.github.io/yebian</p>
      </div>
      <img class="sticker" src="public/stickers/sticker-01.png" alt="" />
    </div>
  </body>
</html>
